<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal ISP Monitor</title>
<style>body{font-family:system-ui,sans-serif;max-width:960px;margin:3em auto;padding:0 1em;background:#f5f7fb;color:#17283b}h1{margin-bottom:.25rem}.muted{color:#5c6b7a}.cards{display:flex;gap:1rem;flex-wrap:wrap}.card{flex:1;min-width:170px;background:white;padding:1.2rem;border-radius:12px;box-shadow:0 2px 8px #0001}table{border-collapse:collapse;width:100%;background:white}td,th{padding:.7rem;border-bottom:1px solid #ddd;text-align:left}button{padding:.6rem 1rem;cursor:pointer}.good{color:#087443}.bad{color:#bf3434}</style></head><body><h1>Personal ISP Monitor</h1><p class="muted">Local TCP-connect measurements • Not a certified ISP speed test</p><button onclick="refresh()">Refresh</button><div class="cards"><div class="card"><b>Samples</b><h2 id="samples">—</h2></div><div class="card"><b>Observed success</b><h2 id="success">—</h2></div><div class="card"><b>Average TCP connect</b><h2 id="latency">—</h2></div></div><h2>Recent measurements</h2><table><thead><tr><th>Time (UTC)</th><th>Endpoint</th><th>TCP Connect (ms)</th><th>Result</th></tr></thead><tbody id="data"></tbody></table><p class="muted">The agent and dashboard run as two processes. Results refresh every 10 seconds.</p><script>
async function refresh(){try{const [s,r]=await Promise.all([fetch('/api/summary'),fetch('/api/measurements?limit=40')]);if(!s.ok||!r.ok)throw Error('API request failed');const summary=await s.json(),rows=await r.json();document.getElementById('samples').textContent=summary.samples;document.getElementById('success').textContent=summary.observed_success_pct===null?'—':summary.observed_success_pct+'%';document.getElementById('latency').textContent=summary.avg_tcp_connect_ms===null?'—':summary.avg_tcp_connect_ms+' ms';const el=document.getElementById('data');el.replaceChildren();for(const row of rows){const tr=document.createElement('tr');for(const value of [row.timestamp,row.host+':'+row.port,row.connect_ms??'—',row.ok?'OK':row.error]){const td=document.createElement('td');td.textContent=String(value);tr.append(td)}tr.lastChild.className=row.ok?'good':'bad';el.append(tr)}}catch(e){document.getElementById('data').textContent='Could not load measurements: '+e.message}}
refresh();setInterval(refresh,10000);
</script></body></html>
